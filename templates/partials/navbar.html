<header class="fixed w-full z-50 py-6 px-8 md:px-16 transition-all border-b border-transparent" id="navbar">
    <div class="max-w-[1400px] mx-auto flex justify-between items-center">
        <div class="text-2xl font-bold tracking-tighter">
            Evelyn<span style="color: var(--accent)">C</span>L
        </div>

        <nav class="hidden lg:flex gap-10 text-[11px] font-bold uppercase tracking-[0.2em] opacity-60">
            <a href="#hero" class="hover:text-[var(--accent)] transition-all">Home</a>
            <a href="#experience" class="hover:text-[var(--accent)] transition-all"><span
                    data-lang="en">Career</span><span data-lang="es">Trayectoria</span></a>
            <a href="#impact" class="hover:text-[var(--accent)] transition-all"><span data-lang="en">Impact</span><span
                    data-lang="es">Impacto</span></a>
            <a href="#skills" class="hover:text-[var(--accent)] transition-all"><span data-lang="en">Skills</span><span
                    data-lang="es">Habilidades</span></a>
            <a href="#certifications" class="hover:text-[var(--accent)] transition-all"><span
                    data-lang="en">Certifications</span><span data-lang="es">Certificaciones</span></a>
            <a href="#life" class="hover:text-[var(--accent)] transition-all"><span data-lang="en">Life</span><span
                    data-lang="es">Vida</span></a>
        </nav>

        <div class="flex items-center gap-6">
            <div class="hidden md:flex items-center gap-3 mr-4 border-r border-white/10 pr-4">
                <a href="{{ profile.github }}" target="_blank"
                    class="opacity-60 hover:opacity-100 hover:text-[var(--accent)] transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22">
                        </path>
                    </svg>
                </a>
                <a href="{{ profile.linkedin }}" target="_blank"
                    class="opacity-60 hover:opacity-100 hover:text-[var(--accent)] transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z">
                        </path>
                        <rect x="2" y="9" width="4" height="12"></rect>
                        <circle cx="4" cy="4" r="2"></circle>
                    </svg>
                </a>
            </div>

            <a href="{{ profile.cv_drive }}" target="_blank" rel="noopener noreferrer"
                class="hidden md:inline-flex items-center gap-2 px-6 py-3 rounded-full border border-[var(--border)] hover:border-[var(--accent)] transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <span data-lang="en">Download CV</span><span data-lang="es">Descargar CV</span>
            </a>

            <button onclick="toggleTheme()" class="p-2 opacity-60 hover:opacity-100 transition-opacity">
                <svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>

            <button onclick="toggleLang()"
                class="text-[10px] font-bold px-4 py-2 border border-current rounded-full hover:bg-[var(--accent)] hover:border-transparent transition-all">
                <span id="lang-label">{{ "ES" if lang == "en" else "EN" }}</span>
            </button>
        </div>
    </div>
</header>
