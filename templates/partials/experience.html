<section id="experience" class="bg-[var(--bg-secondary)] rounded-[4rem] my-10">
    <div class="w-full">
        <h2 class="text-5xl md:text-7xl font-bold mb-20 reveal">The Technical <span
                style="color: var(--accent)">Story</span></h2>

        <div class="timeline-line space-y-12 max-w-5xl mx-auto">
            {% for exp in experiences %}
            <div class="relative pl-12 reveal" {% if loop.index0> 0 %}style="transition-delay: {{ loop.index0 * 0.1
                }}s"{% endif %}>
                <div
                    class="absolute left-0 top-1 w-10 h-10 bg-[var(--bg-primary)] border-4 border-[var(--accent)] rounded-full z-10 {% if not loop.first %}opacity-{{ [50,20,10,10,10][loop.index0] if loop.index0 < 5 else 10 }}{% endif %}">
                </div>
                <div class="glass p-10 group hover:translate-x-4 transition-transform">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                        <div>
                            <h3 class="text-3xl font-bold">{{ exp.role[lang] }}</h3>
                            <p class="text-[var(--accent)] font-bold tracking-widest text-xs uppercase mt-1"
                                data-lang="en">
                                {{ exp.company }} | {{ exp.period.en }}
                            </p>
                            <p class="text-[var(--accent)] font-bold tracking-widest text-xs uppercase mt-1"
                                data-lang="es">
                                {{ exp.company }} | {{ exp.period.es }}
                            </p>
                        </div>
                        <button onclick="openModal('{{ exp.id }}')"
                            class="btn-accent px-6 py-2 text-[10px] font-bold uppercase tracking-widest">
                            <span data-lang="en">Deep Dive</span><span data-lang="es">Ver Detalles</span>
                        </button>
                    </div>

                    <p class="opacity-60 leading-relaxed max-w-3xl" data-lang="en">
                        {{ exp.description.en }}
                    </p>
                    <p class="opacity-60 leading-relaxed max-w-3xl" data-lang="es">
                        {{ exp.description.es }}
                    </p>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
