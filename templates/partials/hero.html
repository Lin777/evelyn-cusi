<section id="hero">
    <div class="grid lg:grid-cols-2 gap-20 items-center w-full">
        <div class="reveal">
            <p class="text-[var(--accent)] font-bold tracking-[0.5em] uppercase text-[18px] mb-8">
                {{ profile.title[lang] }}
            </p>
            <h1 class="mb-10">
                <span class="name-hero">{{ profile.name.split(" ")[0] | upper }}</span><br>
                <span class="lastname-hero">{{ " ".join(profile.name.split(" ")[1:]) | upper }}</span>
            </h1>
            <p class="text-xl md:text-2xl opacity-70 mb-12 max-w-xl leading-relaxed font-light">
                <span data-lang="en">{{ profile.subtitle.en }}</span>
                <span data-lang="es">{{ profile.subtitle.es }}</span>
            </p>
            <div class="flex flex-wrap gap-6">
                <a href="#contact" class="btn-accent px-12 py-5 font-bold text-sm">
                    <span data-lang="en">Get in touch</span><span data-lang="es">Hablemos</span>
                </a>
                <a href="{{ profile.cv_drive }}" target="_blank" rel="noopener noreferrer"
                    class="glass px-10 py-4 font-bold text-sm flex items-center gap-3 border-white/10 hover:border-[var(--accent)] transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    <span data-lang="en">Download CV</span><span data-lang="es">Descargar CV</span>
                </a>
            </div>
        </div>

        <div class="relative flex justify-center items-center reveal" style="transition-delay: 0.2s">
            <div class="profile-frame">
                <img src="assets/images/evelyn_cusi.jpeg" alt="{{ profile.name }}" class="profile-img">
            </div>
            <div class="chip top-0 right-10" style="animation-delay: 0s">⚡ GenAI & Agents</div>
            <div class="chip top-40 -left-12" style="animation-delay: 2s">👁️ Document AI</div>
            <div class="chip bottom-10 right-0" style="animation-delay: 4s">🚀 Production MLOps</div>
        </div>
    </div>
</section>
